name: chạy việc của tinhca-web
# Máy chạy miễn phí (kho công khai) làm hộ các việc nặng của kho riêng tư tinhca-web:
# thu giọng ai33, làm nhạc, chèn điệp khúc, dựng video… rồi ghi kết quả về tinhca-web.
# Chỉ chủ kho bấm chạy được (workflow_dispatch). Khóa nằm trong Secrets, không ghi vào mã.
on:
  schedule:
    - cron: '17 3 * * *'   # 10:17 giờ VN: lấy clip Muse làm lúc 8:00 về (tools/muse/lay.py)
  workflow_dispatch:
    inputs:
      lenh:
        description: 'Lệnh chạy trong thư mục tinhca-web (vd python3 tools/ai33/chay.py tools/ai33/viec/x.json)'
        required: true
      luu:
        description: 'Các đường dẫn cần ghi về tinhca-web (cách nhau bằng dấu cách)'
        required: false
        default: ''
      cai:
        description: 'Gói pip cần cài thêm'
        required: false
        default: 'boto3 numpy'
      tep:
        description: 'Thư mục (trong tinhca-web) để tải về dạng artifact, giữ 3 ngày'
        required: false
        default: ''
      ten:
        description: 'Ghi chú cho lần chạy'
        required: false
        default: ''
run-name: ${{ github.event.inputs.ten || github.event.inputs.lenh || 'Lấy clip Muse hằng ngày' }}
permissions:
  contents: write
jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Lấy kho tinhca-web
        env:
          TK: ${{ secrets.TINHCA_TOKEN }}
        run: |
          T=$(printf %s "$TK" | tr -d '[:space:]'); echo "::add-mask::$T"
          git clone -q --depth 2 "https://x-access-token:${T}@github.com/vohoaphuc85-eng/tinhca-web.git" web
      - name: Cài công cụ
        env:
          CAI: ${{ github.event.inputs.cai || 'boto3' }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
          pip install -q $CAI
      - name: Chạy
        working-directory: web
        env:
          LENH: ${{ github.event.inputs.lenh || 'python3 tools/muse/lay.py' }}
          K_AI33: ${{ secrets.AI33_API_KEY }}
          K_R2A: ${{ secrets.R2_ACCOUNT_ID }}
          K_R2I: ${{ secrets.R2_ACCESS_KEY_ID }}
          K_R2S: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          K_YTI: ${{ secrets.YT_CLIENT_ID }}
          K_YTS: ${{ secrets.YT_CLIENT_SECRET }}
          K_YTK: ${{ secrets.YT_KARAOKE_REFRESH }}
          K_YTT: ${{ secrets.YT_TRUEWAY_REFRESH }}
          K_YTV: ${{ secrets.YT_VUONGTV_REFRESH }}
        run: |
          s() { printf %s "$1" | tr -d '[:space:]'; }
          export AI33_API_KEY=$(s "$K_AI33") R2_ACCOUNT_ID=$(s "$K_R2A") R2_ACCESS_KEY_ID=$(s "$K_R2I") R2_SECRET_ACCESS_KEY=$(s "$K_R2S") YT_CLIENT_ID=$(s "$K_YTI") YT_CLIENT_SECRET=$(s "$K_YTS") YT_KARAOKE_REFRESH=$(s "$K_YTK") YT_TRUEWAY_REFRESH=$(s "$K_YTT") YT_VUONGTV_REFRESH=$(s "$K_YTV")
          for v in "$AI33_API_KEY" "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" "$YT_CLIENT_SECRET" "$YT_KARAOKE_REFRESH" "$YT_TRUEWAY_REFRESH" "$YT_VUONGTV_REFRESH"; do echo "::add-mask::$v"; done
          bash -c "$LENH"
      - name: Tải kết quả về (artifact)
        if: always() && github.event.inputs.tep != ''
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua
          path: web/${{ github.event.inputs.tep }}
          retention-days: 3
          compression-level: 0
      - name: Đưa kết quả lên Release (để tải về máy Vương)
        if: always() && github.event.inputs.tep != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TEP: ${{ github.event.inputs.tep }}
        run: |
          for r in $(gh release list --repo "${{ github.repository }}" --limit 50 --json tagName -q '.[].tagName' | grep '^goi-'); do gh release delete "$r" --repo "${{ github.repository }}" --yes --cleanup-tag || true; done
          cd "web/$TEP" || exit 0
          export LC_ALL=C.UTF-8; for d in */; do d=${d%/}; (cd "$d" && zip -0 -qr -UN=UTF8 "$GITHUB_WORKSPACE/goi-$d.zip" .); done
          ls -la $GITHUB_WORKSPACE/*.zip
          gh release create "goi-${{ github.run_id }}" $GITHUB_WORKSPACE/goi-*.zip --repo "${{ github.repository }}" --title "Gói video ${{ github.run_id }}" --notes "Tạm, xóa sau khi tải" --prerelease
      - name: Ghi kết quả về tinhca-web
        if: always() && (github.event_name == 'schedule' || github.event.inputs.luu != '')
        working-directory: web
        env:
          LUU: ${{ github.event.inputs.luu || 'tools/muse' }}
          TEN: ${{ github.event.inputs.ten }}
        run: |
          git config user.name "tinhca-bot"; git config user.email "bot@tinhca.org"
          for p in $LUU; do [ -e "$p" ] && git add "$p"; done; true
          git diff --cached --quiet && { echo "không có gì mới"; exit 0; }
          git commit -q -m "tinhca-may: ${TEN:-kết quả} [CI Skip]"
          for i in 1 2 3 4 5 6; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 15 + 5)); done; exit 1
